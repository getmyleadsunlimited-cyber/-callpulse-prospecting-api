databases:
  - name: callpulse-postgres
    plan: free
services:
  - type: web
    name: callpulse-prospecting-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: callpulse-postgres, property: connectionString}
      - key: CALLPULSE_ACTIONS_API_KEY
        generateValue: true
      - key: MICROSOFT_GRAPH_ACCESS_TOKEN
        sync: false
      - key: MICROSOFT_GRAPH_SENDER
        sync: false
      - key: PYTHON_VERSION
        value: 3.13.5
