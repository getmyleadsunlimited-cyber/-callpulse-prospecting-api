services:
  - type: web
    name: callpulse-prospecting-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CALLPULSE_ACTIONS_API_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.13.5
