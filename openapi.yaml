openapi: 3.1.0
info:
  title: CallPulse.org Prospecting Queue API
  version: 1.0.0
servers:
  - url: https://REPLACE-WITH-YOUR-RENDER-URL.onrender.com
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check API health.
      responses:
        "200": {description: OK}
  /prospects:
    get:
      operationId: listProspects
      summary: List prospects.
      parameters:
        - in: query
          name: status
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, default: 25}
      responses:
        "200": {description: Prospect list}
    post:
      operationId: createProspect
      summary: Save a researched prospect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [company_name, website, industry, score, why_now, ai_recovery_opportunity]
              properties:
                company_name: {type: string}
                website: {type: string}
                industry: {type: string}
                score: {type: integer, minimum: 0, maximum: 100}
                why_now: {type: string}
                ai_recovery_opportunity: {type: string}
                decision_maker_name: {type: string}
                decision_maker_title: {type: string}
                best_contact_channel: {type: string}
                verified_contact: {type: string}
                opening_message: {type: string}
      responses:
        "200": {description: Saved}
  /prospects/{prospect_id}/approve:
    post:
      operationId: approveProspect
      summary: Approve a prospect.
      parameters:
        - in: path
          name: prospect_id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approved_by]
              properties:
                approved_by: {type: string}
      responses:
        "200": {description: Approved}
  /prospects/{prospect_id}/draft:
    post:
      operationId: saveOutreachDraft
      summary: Save outreach draft after approval.
      parameters:
        - in: path
          name: prospect_id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: {type: string}
      responses:
        "200": {description: Draft saved}
  /prospects/{prospect_id}/reply:
    post:
      operationId: recordReply
      summary: Record prospect reply.
      parameters:
        - in: path
          name: prospect_id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply_text]
              properties:
                reply_text: {type: string}
                intent: {type: string}
      responses:
        "200": {description: Reply saved}
  /prospects/{prospect_id}/conversion:
    post:
      operationId: markConversion
      summary: Record signup stage.
      parameters:
        - in: path
          name: prospect_id
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversion_stage]
              properties:
                conversion_stage:
                  type: string
                  enum: [signup_link_sent, standard_start, three_day_trial, converted, declined]
      responses:
        "200": {description: Stage saved}
