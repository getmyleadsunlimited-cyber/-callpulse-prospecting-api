openapi: 3.1.0
info:
  title: CallPulse Autonomous Campaign API
  version: 3.0.0
  description: >-
    Verified-email, suppression-aware autonomous seven-day outreach. Bearer credentials are bound to
    direct, agency, or client workspace grants. X-Workspace-ID only selects an already-authorized grant;
    a foreign selection returns 403 and foreign resource IDs within an authorized workspace remain 404.
servers:
  - url: https://callpulse-prospecting-api.onrender.com
security: [{bearerAuth: []}]
paths:
  /auth/login:
    post:
      security: []
      operationId: loginCustomerUser
      summary: Exchange a customer email and password for an opaque bearer token.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Login'}}}
      responses: {'200': {description: Expiring bearer token}, '401': {description: Invalid credentials}, '429': {description: Login throttled}}
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current bearer session.
      responses: {'204': {description: Session revoked}}
  /auth/revoke-all:
    post:
      operationId: revokeAllSessions
      summary: Revoke every session belonging to the authenticated identity.
      responses: {'204': {description: Sessions revoked}}
  /auth/revoke-account:
    post:
      operationId: revokeAccountSessions
      summary: Owner-only revocation of every session for every membership in the current account.
      responses: {'204': {description: Account sessions revoked and audited}}
  /auth/change-password:
    post:
      operationId: changePassword
      summary: Change the identity password and revoke all existing sessions.
      responses: {'204': {description: Password changed and sessions revoked}}
  /me:
    get:
      operationId: currentUser
      summary: Return the authenticated user's account, role, and authorized workspace set.
      responses: {'200': {description: Current user identity}, '401': {description: Unauthorized}}
  /users:
    get:
      operationId: listUsers
      summary: List users in the owner's account.
      responses: {'200': {description: Account users}, '403': {description: Owner role required}}
    post:
      operationId: inviteUser
      summary: Create an account-local pending invitation; credentials are established only by the invitee.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UserCreate'}}}
      responses: {'201': {description: Generic pending-invitation acknowledgement}, '403': {description: Owner role required}, '503': {description: Invitation delivery unavailable; transaction rolled back}}
  /invitations/accept:
    post:
      security: []
      operationId: acceptInvitation
      summary: Accept a single-use invitation; existing identities authenticate and new identities set a password.
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/InvitationAccept'}}}
      responses: {'201': {description: Account membership created}, '410': {description: Invitation invalid, used, or expired}}
  /users/{membership_id}/role:
    patch:
      operationId: changeUserRole
      parameters: [{in: path, name: membership_id, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [role], properties: {role: {$ref: '#/components/schemas/UserRole'}}}}}
      responses: {'200': {description: Role changed and audited}, '404': {description: User not found in account}}
  /users/{membership_id}/deactivate:
    post:
      operationId: deactivateUser
      parameters: [{in: path, name: membership_id, required: true, schema: {type: integer}}]
      responses: {'200': {description: User deactivated, sessions revoked, and action audited}}
  /users/{membership_id}/workspace-access:
    put:
      operationId: changeUserWorkspaceAccess
      parameters: [{in: path, name: membership_id, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [workspace_ids], properties: {workspace_ids: {type: array, items: {type: string}}}}}}
      responses: {'200': {description: Workspace grants replaced and audited}, '403': {description: Grant exceeds owner's access}}
  /users/{membership_id}/revoke-sessions:
    post:
      operationId: revokeMembershipSessions
      parameters: [{in: path, name: membership_id, required: true, schema: {type: integer}}]
      responses: {'204': {description: Membership sessions revoked and audited}}
  /internal/agency-workspaces:
    post:
      operationId: delegateAgencyWorkspace
      summary: Internal-admin provisioning of an authoritative agency-to-client-workspace relationship.
      responses: {'201': {description: Relationship created}, '403': {description: Internal administrator required}}
  /health:
    get:
      security: []
      operationId: healthCheck
      responses: {'200': {description: Database-connected health status}}
  /launcher:
    get:
      security: []
      operationId: launcher
      summary: Render the CallPulse campaign launcher operator UI.
      responses:
        '200':
          description: Campaign launcher HTML
          content:
            text/html:
              schema: {type: string}
  /industries:
    get:
      operationId: listIndustryButtons
      summary: Return selectable business verticals and industry opening-message helpers.
      responses: {'200': {description: Industry buttons}}
  /email-provider/status:
    get:
      operationId: inspectEmailProviderStatus
      summary: Inspect non-secret email provider readiness without sending.
      responses:
        '200': {description: Provider mode, readiness, approved sender, and disabled automatic live-send state}
        '401': {description: Unauthorized}
  /prospects:
    get:
      operationId: listProspects
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
        - {in: query, name: status, schema: {type: string}}
        - {in: query, name: industry, schema: {$ref: '#/components/schemas/Industry'}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses: {'200': {description: Prospect list}, '401': {description: Unauthorized}}
    post:
      operationId: createProspect
      parameters: [{$ref: '#/components/parameters/workspaceId'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/Prospect'}}}
      responses: {'201': {description: Created}, '409': {description: Duplicate email}, '422': {description: Unverified or invalid}}
  /prospects/{prospect_id}/approve:
    post:
      operationId: approveProspect
      summary: Approve a researched prospect in the selected authorized workspace.
      description: Idempotently changes a researched prospect to approved without verifying its email or initiating outreach.
      parameters: [{$ref: '#/components/parameters/prospectId'}, {$ref: '#/components/parameters/workspaceId'}]
      responses:
        '200': {description: Prospect approved, or the current prospect state returned unchanged on a retry}
        '403': {description: The authenticated role or selected workspace is not authorized}
        '404': {description: Prospect not found in the selected workspace}
  /prospects/{prospect_id}/campaigns:
    get:
      operationId: inspectProspectCampaigns
      summary: Read all persisted campaign scheduling and sequence state for a prospect.
      parameters: [{$ref: '#/components/parameters/prospectId'}, {$ref: '#/components/parameters/workspaceId'}]
      responses:
        '200':
          description: Campaign inspection results with persisted dry-run and authorization state
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/CampaignInspection'}}
        '401': {description: Unauthorized}
        '404': {description: Prospect not found}
    post:
      operationId: launchSevenDayCampaign
      parameters: [{$ref: '#/components/parameters/prospectId'}, {$ref: '#/components/parameters/workspaceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idempotency_key]
              properties:
                idempotency_key: {type: string, minLength: 8, maxLength: 100}
                start_at: {type: [string, 'null'], format: date-time}
      responses: {'201': {description: Idempotent campaign with Day 0/3/6 touches}, '409': {description: Suppressed}}
  /internal/prospects/{prospect_id}/verify-email:
    post:
      operationId: verifyProspectEmailInternal
      summary: Internal-admin-only transition that verifies an exact normalized email and invalidates prior recipient authorization on change.
      parameters: [{$ref: '#/components/parameters/prospectId'}, {$ref: '#/components/parameters/workspaceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verified_email]
              properties: {verified_email: {type: string, format: email}}
      responses:
        '200': {description: Prospect email normalized and marked verified; changed recipients invalidate campaign authorization and unsent delivery eligibility}
        '409': {description: The normalized verified email is already assigned to another prospect in the selected workspace}
        '403': {description: Internal administrator authentication required}
        '404': {description: Prospect not found in the selected workspace}
  /campaigns/{campaign_id}/deliveries:
    get:
      operationId: inspectCampaignDeliveries
      summary: Read persisted delivery/touch scheduling state without triggering delivery.
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
        - {in: path, name: campaign_id, required: true, schema: {type: integer}}
      responses:
        '200':
          description: Delivery inspection results with persisted safety state
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DeliveryInspection'}}
        '401': {description: Unauthorized}
        '404': {description: Campaign not found}
  /campaigns/{campaign_id}/authorize-live:
    post:
      operationId: authorizeCampaignLive
      summary: Explicitly authorize a campaign for future live execution after safety checks.
      parameters: [{$ref: '#/components/parameters/campaignId'}, {$ref: '#/components/parameters/workspaceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorized_by, confirmation]
              properties:
                authorized_by: {type: string}
                confirmation: {type: string, const: 'AUTHORIZE LIVE OUTREACH'}
      responses:
        '200': {description: Persisted campaign authorization state; no outreach is sent}
        '409': {description: Campaign failed live authorization safety checks}
  /campaigns/{campaign_id}/safety:
    get:
      operationId: inspectCampaignSafety
      summary: Read live authorization, suppression, destination, and delivery eligibility state.
      parameters: [{$ref: '#/components/parameters/campaignId'}, {$ref: '#/components/parameters/workspaceId'}]
      responses:
        '200': {description: Read-only campaign safety state}
        '404': {description: Campaign not found}
  /campaigns/{campaign_id}/canary-execute:
    post:
      operationId: executeOneCanaryDelivery
      summary: Explicitly attempt at most one persisted email delivery.
      parameters: [{$ref: '#/components/parameters/campaignId'}, {$ref: '#/components/parameters/workspaceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [authorized_by, confirmation, delivery_id]
              properties:
                authorized_by: {type: string}
                confirmation: {type: string, const: 'EXECUTE ONE CANARY DELIVERY'}
                delivery_id: {type: integer}
      responses:
        '200': {description: Confirmed send or idempotent already-executed result}
        '409': {description: Structured fail-closed safety failures; provider was not called}
        '503': {description: Email provider is disabled or incompletely configured}
  /deliveries/{delivery_id}/execution:
    get:
      operationId: inspectDeliveryExecution
      summary: Read non-secret persisted canary execution state; never execute.
      parameters: [{$ref: '#/components/parameters/deliveryId'}, {$ref: '#/components/parameters/workspaceId'}]
      responses:
        '200': {description: Persisted execution state}
        '404': {description: Delivery not found}
  /deliveries/{delivery_id}/canary-preflight:
    get:
      operationId: preflightCanaryDelivery
      summary: Evaluate current canary eligibility without changing state.
      parameters: [{$ref: '#/components/parameters/deliveryId'}, {$ref: '#/components/parameters/workspaceId'}]
      responses:
        '200': {description: Structured eligibility decision and all failures}
        '404': {description: Delivery not found}
  /campaigns/{campaign_id}/canary-audits:
    get:
      operationId: inspectCanaryAudits
      summary: Read non-secret canary audit records within the authorized workspace.
      parameters: [{$ref: '#/components/parameters/campaignId'}, {$ref: '#/components/parameters/workspaceId'}]
      responses:
        '200': {description: Canary audit records for the tenant-scoped campaign}
        '403': {description: Credential is not authorized for the selected workspace}
        '404': {description: Campaign not found in the authorized workspace}
  /launcher/run:
    post:
      operationId: runDueCampaignTouches
      parameters:
        - {$ref: '#/components/parameters/workspaceId'}
        - {in: query, name: now_at, schema: {type: [string, 'null'], format: date-time}}
      responses: {'200': {description: Due-touch results}}
  /suppressions:
    post:
      operationId: suppressEmail
      parameters: [{$ref: '#/components/parameters/workspaceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, reason]
              properties: {email: {type: string}, reason: {type: string}}
      responses: {'201': {description: Recipient and campaigns suppressed}}
  /prospects/{prospect_id}/reply:
    post:
      operationId: recordReplyAndStopCampaign
      parameters: [{$ref: '#/components/parameters/prospectId'}, {$ref: '#/components/parameters/workspaceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reply_text]
              properties: {reply_text: {type: string}, intent: {type: string, default: unknown}}
      responses: {'200': {description: Reply recorded and campaign stopped}}
  /prospects/{prospect_id}/conversion:
    post:
      operationId: recordConversion
      parameters: [{$ref: '#/components/parameters/prospectId'}, {$ref: '#/components/parameters/workspaceId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversion_stage]
              properties:
                conversion_stage: {type: string, enum: [signup_link_sent, standard_start, three_day_trial, converted, declined]}
      responses: {'200': {description: Conversion recorded}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    prospectId: {in: path, name: prospect_id, required: true, schema: {type: integer}}
    campaignId: {in: path, name: campaign_id, required: true, schema: {type: integer}}
    deliveryId: {in: path, name: delivery_id, required: true, schema: {type: integer}}
    workspaceId:
      in: header
      name: X-Workspace-ID
      required: false
      description: Selects only a workspace already granted to the bearer credential; never grants access. Omission selects the credential's own workspace.
      schema: {type: string}
  schemas:
    Login:
      type: object
      required: [email, password, account_id]
      properties: {email: {type: string, format: email}, password: {type: string, format: password, maxLength: 256}, account_id: {type: string}}
    UserRole:
      type: string
      enum: [owner, admin, member, viewer]
    UserCreate:
      type: object
      required: [email, role]
      properties:
        email: {type: string, format: email}
        role: {$ref: '#/components/schemas/UserRole'}
        account_id: {type: [string, 'null'], description: Internal-administrator bootstrap only; owners inherit their account.}
        account_type: {type: [string, 'null'], enum: [direct, agency, client, null]}
        primary_workspace_id: {type: [string, 'null']}
        workspace_ids: {type: array, items: {type: string}, default: []}
    InvitationAccept:
      type: object
      required: [token]
      properties:
        token: {type: string, minLength: 20, maxLength: 200, writeOnly: true}
        password: {type: [string, 'null'], format: password, minLength: 12, maxLength: 256, writeOnly: true}
    CampaignSequenceState:
      type: object
      required: [day, status, scheduled_at, sent_at]
      properties:
        day: {type: integer, enum: [0, 3, 6]}
        status: {type: string}
        scheduled_at: {type: string, format: date-time}
        sent_at: {type: [string, 'null'], format: date-time}
    CampaignInspection:
      type: object
      required: [id, prospect_id, industry, status, starts_at, ends_at, dry_run, live_authorized, live_authorized_at, live_authorized_by, current_sequence_state, stopped, stop_reason]
      properties:
        id: {type: integer}
        prospect_id: {type: integer}
        industry: {$ref: '#/components/schemas/Industry'}
        status: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        dry_run: {type: boolean, description: Persisted campaign dry-run state.}
        live_authorized: {type: boolean}
        live_authorized_at: {type: [string, 'null'], format: date-time}
        live_authorized_by: {type: [string, 'null']}
        current_sequence_state: {type: array, items: {$ref: '#/components/schemas/CampaignSequenceState'}}
        stopped: {type: boolean}
        stop_reason: {type: [string, 'null'], description: Null because the current schema does not persist a campaign stop reason.}
    DeliveryInspection:
      type: object
      required: [id, campaign_id, prospect_id, sequence_day, scheduled_at, message, status, dry_run, skipped, sent_at, cancelled, cancellation_or_skip_reason, idempotency_key]
      properties:
        id: {type: integer}
        campaign_id: {type: integer}
        prospect_id: {type: integer}
        sequence_day: {type: integer, enum: [0, 3, 6]}
        scheduled_at: {type: string, format: date-time}
        message: {type: string}
        status: {type: string}
        dry_run: {type: boolean, description: Persisted delivery dry-run state.}
        skipped: {type: boolean, description: Persisted skip state.}
        sent_at: {type: [string, 'null'], format: date-time}
        cancelled: {type: boolean, description: Persisted cancellation state.}
        cancellation_or_skip_reason: {type: [string, 'null'], description: Persisted safety stop reason.}
        idempotency_key: {type: string, description: Opaque delivery deduplication key; contains no provider credential.}
    Prospect:
      type: object
      required: [company_name, website, industry, score, why_now, ai_recovery_opportunity]
      properties:
        company_name: {type: string, minLength: 1, maxLength: 200}
        website: {type: string, pattern: '^https?://'}
        industry: {$ref: '#/components/schemas/Industry'}
        location: {type: string, minLength: 1, maxLength: 200, default: 'Houston, TX'}
        score: {type: integer, minimum: 65, maximum: 100}
        why_now: {type: string, minLength: 1}
        ai_recovery_opportunity: {type: string, minLength: 1}
        decision_maker_name: {type: [string, 'null']}
        decision_maker_title: {type: [string, 'null']}
        verified_email:
          type: [string, 'null']
          description: Optional business contact email. It is not outreach-ready unless email_verified is true.
        opening_message: {type: [string, 'null']}
    Industry:
      type: string
      enum: [eCommerce, Roofing, HVAC, Dental, Garage Door Repair, Plumbing, Emergency Towing, Water Restoration, Mold Remediation, Pest Control, Electrical, Foundation Repair, Tree Service, Pool Service, Landscaping / Lawn Care, Med Spa, Final Expense, Auto Insurance]
