openapi: 3.1.0
info:
  title: CallPulse Prospecting API
  version: 2.0.0
servers:
  - url: https://callpulse-prospecting-api.onrender.com
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  schemas:
    Campaign:
      type: object
      required: [name, industry]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        industry: {type: string, enum: [Roofing, HVAC, Plumbing, Dental, Med Spa, Legal, Real Estate, Final Expense, Auto Insurance]}
    Prospect:
      type: object
      required: [company_name, email, email_verified, score]
      properties:
        company_name: {type: string}
        email: {type: string, format: email}
        email_verified: {type: boolean}
        score: {type: integer, minimum: 0, maximum: 100}
security: [{bearerAuth: []}]
paths:
  /health:
    get: {operationId: health, security: [], responses: {'200': {description: Healthy}}}
  /industries:
    get: {operationId: industries, responses: {'200': {description: Supported industries}}}
  /launcher:
    get: {operationId: launcher, security: [], responses: {'200': {description: Campaign launcher HTML}}}
  /campaigns:
    get: {operationId: listCampaigns, responses: {'200': {description: Campaign list}}}
    post:
      operationId: createCampaign
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Campaign'}}}}
      responses: {'201': {description: Created}, '422': {description: Invalid industry}}
  /campaigns/{campaign_id}:
    parameters: [{name: campaign_id, in: path, required: true, schema: {type: integer}}]
    get: {operationId: getCampaign, responses: {'200': {description: Campaign}, '404': {description: Not found}}}
    delete: {operationId: deleteCampaign, responses: {'204': {description: Deleted}, '404': {description: Not found}}}
  /campaigns/{campaign_id}/prospects:
    parameters: [{name: campaign_id, in: path, required: true, schema: {type: integer}}]
    get: {operationId: listCampaignProspects, responses: {'200': {description: Prospect list}}}
    post:
      operationId: addCampaignProspect
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/Prospect'}}}}
      responses: {'201': {description: Created or existing deduplicated prospect}}
  /prospects/{prospect_id}/events:
    post:
      operationId: suppressProspect
      parameters: [{name: prospect_id, in: path, required: true, schema: {type: integer}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [event], properties: {event: {type: string, enum: [reply, opt_out, hard_bounce]}}}}}
      responses: {'200': {description: Suppressed and pending delivery cancelled}}
  /deliveries/run:
    post: {operationId: runDeliveries, responses: {'200': {description: Due deliveries processed idempotently}}}
